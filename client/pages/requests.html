<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyAsset — Equipment &amp; Service Requests</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app-shell.css">
<style>
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(18, 24, 20, 0.55);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    background: var(--panel-bg);
    border-radius: var(--radius-lg);
    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: 10px 16px 36px var(--shadow-dark);
    width: 100%;
    max-width: 500px;
    padding: 24px;
  }
  .modal-field { margin-bottom: 14px; }
  .modal-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar" aria-label="Sidebar"></aside>

  <div class="app-main">
    <header class="app-topbar">
      <button type="button" class="app-icon-btn app-menu-btn" id="appMenuBtn" aria-label="Open navigation"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>

      <div class="app-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="reqSearchInput" placeholder="Search equipment &amp; service requests..." onkeyup="filterRequests()">
      </div>

      <div class="app-topbar-actions">
        <a href="alerts.html" class="app-icon-btn" aria-label="Alerts" title="Alerts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></a>
        <div class="app-user" id="appUser" hidden>
          <span class="app-avatar" aria-hidden="true"></span>
          <span class="app-user-name"></span>
        </div>
        <button class="pill-btn pill-btn-emerald app-cta" onclick="openRequestModal()" aria-label="Submit Request">
          <span class="app-cta-icon" aria-hidden="true">+</span><span class="app-cta-label">Submit Request</span>
        </button>
      </div>
    </header>

    <main class="page-content">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;">
        <div>
          <h1 style="font-size: 26px; font-weight: 800; color: var(--text-primary);">Equipment &amp; Maintenance Requests</h1>
          <p style="font-size: 13.5px; color: var(--text-secondary); margin-top: 2px;">Review and process equipment allocation and repair requests.</p>
        </div>
        <button class="pill-btn pill-btn-emerald" onclick="openRequestModal()">+ Submit Request</button>
      </div>

      <!-- REQUESTS TABLE CARD -->
      <div class="neu-panel" style="padding: 0; overflow: hidden;">
        <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
          <thead>
            <tr style="background: rgba(234, 230, 220, 0.4); text-align: left; font-size: 11.5px; color: var(--text-secondary); text-transform: uppercase;">
              <th style="padding: 14px 18px;">Requester</th>
              <th style="padding: 14px 18px;">Target Asset</th>
              <th style="padding: 14px 18px;">Description / Reason</th>
              <th style="padding: 14px 18px;">Submitted Date</th>
              <th style="padding: 14px 18px;">Priority</th>
              <th style="padding: 14px 18px;">Status</th>
              <th style="padding: 14px 18px; text-align: center;">Actions</th>
            </tr>
          </thead>
          <tbody id="requestsTableBody">
            <tr><td colspan="7" style="padding: 24px; text-align: center; color: var(--text-secondary);">Loading requests from database...</td></tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<!-- SUBMIT REQUEST MODAL -->
<div class="modal-overlay" id="requestModal">
  <div class="modal-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h3 style="font-size: 18px; font-weight: 800;">Submit Service Request</h3>
      <button onclick="closeRequestModal()" style="border:none; background:none; font-size:20px; cursor:pointer;">✕</button>
    </div>
    <form onsubmit="handleSubmitRequest(event)">
      <div class="modal-field">
        <label>Select Asset *</label>
        <select class="filter-select" id="reqAssetSelect" required style="width: 100%;">
          <option value="">Loading assets...</option>
        </select>
      </div>
      <div class="modal-field">
        <label>Priority *</label>
        <select class="filter-select" id="reqPriority" style="width: 100%;">
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
          <option value="Critical">Critical</option>
        </select>
      </div>
      <div class="modal-field">
        <label>Issue Description / Reason *</label>
        <div class="neu-inset" style="padding: 8px 14px;">
          <input type="text" id="reqDescription" required placeholder="Describe issue or required maintenance..." style="border:none; background:transparent; width:100%; outline:none;">
        </div>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button type="submit" class="pill-btn pill-btn-emerald" style="flex: 1; justify-content: center;">Submit Request</button>
        <button type="button" class="pill-btn pill-btn-light" onclick="closeRequestModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
  let allRequests = [];

  async function loadRequests() {
    try {
      const res = await fetch('/api/v1/maintenance/requests');
      if (res.ok) {
        const data = await res.json();
        allRequests = Array.isArray(data) ? data : [];
        renderRequests(allRequests);
      } else {
        document.getElementById('requestsTableBody').innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: var(--rose-crimson);">Failed to load requests</td></tr>';
      }
    } catch (e) {
      console.error(e);
      document.getElementById('requestsTableBody').innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: var(--rose-crimson);">Error connecting to database.</td></tr>';
    }
  }

  function renderRequests(requests) {
    const tbody = document.getElementById('requestsTableBody');
    if (!requests || requests.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 30px; color: var(--text-tertiary);">No maintenance requests found. Click "+ Submit Request" to create one.</td></tr>';
      return;
    }

    tbody.innerHTML = requests.map(req => {
      const isPending = !req.status || req.status.toLowerCase() === 'pending';
      const statusBadge = req.status === 'Completed' || req.status === 'APPROVED' ? 'pill-ok' : 
        (req.status === 'In Progress' ? 'pill-neutral' : 
        (req.status === 'REJECTED' ? 'pill-alert' : 'pill-attn'));

      return `
        <tr style="border-bottom: 1px solid var(--status-neutral-bg);">
          <td style="padding: 14px 18px;"><strong>${escapeHtml(req.requester_name || req.assignee_name || 'Staff')}</strong></td>
          <td style="padding: 14px 18px;">
            <a href="asset-details.html?id=${req.asset_id}" style="color:var(--text-primary); text-decoration:none; font-weight:700;">${escapeHtml(req.asset_name || 'Asset')}</a>
            ${req.asset_tag ? `<br><span class="mono" style="font-size:11px; color:var(--emerald-deep);">${escapeHtml(req.asset_tag)}</span>` : ''}
          </td>
          <td style="padding: 14px 18px;">${escapeHtml(req.description || 'General Service')}</td>
          <td style="padding: 14px 18px;">${new Date(req.created_at).toLocaleDateString()}</td>
          <td style="padding: 14px 18px;"><span class="pill-badge pill-neutral">${escapeHtml(req.priority || 'Medium')}</span></td>
          <td style="padding: 14px 18px;"><span class="pill-badge ${statusBadge}">${escapeHtml(req.status || 'Pending')}</span></td>
          <td style="padding: 14px 18px; text-align: center;">
            ${isPending ? `
              <div style="display: flex; gap: 6px; justify-content: center;">
                <button class="pill-btn pill-btn-emerald" style="padding: 4px 10px; font-size: 11.5px;" onclick="updateStatus(${req.id}, 'In Progress')">Approve</button>
                <button class="pill-btn pill-btn-light" style="padding: 4px 10px; font-size: 11.5px;" onclick="updateStatus(${req.id}, 'REJECTED')">Reject</button>
              </div>
            ` : (req.status === 'In Progress' ? `
              <button class="pill-btn pill-btn-emerald" style="padding: 4px 10px; font-size: 11.5px;" onclick="updateStatus(${req.id}, 'Completed')">Complete</button>
            ` : `<span style="font-size:11px; color:var(--text-tertiary);">Processed</span>`)}
          </td>
        </tr>
      `;
    }).join('');
  }

  function filterRequests() {
    const q = (document.getElementById('reqSearchInput')?.value || '').toLowerCase();
    const filtered = allRequests.filter(r => {
      const text = `${r.asset_name || ''} ${r.requester_name || ''} ${r.description || ''} ${r.status || ''}`.toLowerCase();
      return !q || text.includes(q);
    });
    renderRequests(filtered);
  }

  async function openRequestModal() {
    document.getElementById('requestModal').classList.add('open');
    const select = document.getElementById('reqAssetSelect');
    select.innerHTML = '<option value="">Loading assets...</option>';

    try {
      const res = await fetch('/api/v1/assets');
      if (res.ok) {
        const data = await res.json();
        const assets = Array.isArray(data) ? data : [];
        if (assets.length === 0) {
          select.innerHTML = '<option value="">No assets registered</option>';
        } else {
          select.innerHTML = '<option value="">Select Asset...</option>' + 
            assets.map(a => `<option value="${a.id}">${escapeHtml(a.name)} (${escapeHtml(a.tag_id)})</option>`).join('');
        }
      }
    } catch (e) {
      console.error(e);
      select.innerHTML = '<option value="">Failed to load assets</option>';
    }
  }

  function closeRequestModal() {
    document.getElementById('requestModal').classList.remove('open');
  }

  async function handleSubmitRequest(e) {
    e.preventDefault();
    const asset_id = Number(document.getElementById('reqAssetSelect').value);
    const priority = document.getElementById('reqPriority').value;
    const description = document.getElementById('reqDescription').value.trim();

    if (!asset_id || !description) {
      window.showToast?.('Please fill out all required fields', 'error');
      return;
    }

    try {
      const res = await fetch('/api/v1/maintenance/requests', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ asset_id, priority, description })
      });

      if (res.ok) {
        window.showToast?.('Request submitted successfully', 'success');
        closeRequestModal();
        document.getElementById('reqDescription').value = '';
        await loadRequests();
      } else {
        const err = await res.json();
        window.showToast?.(err.error || 'Failed to submit request', 'error');
      }
    } catch (err) {
      console.error(err);
      window.showToast?.('Network error submitting request', 'error');
    }
  }

  async function updateStatus(id, newStatus) {
    try {
      const res = await fetch(`/api/v1/maintenance/requests/${id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });

      if (res.ok) {
        window.showToast?.(`Request marked as ${newStatus}`, 'success');
        await loadRequests();
      } else {
        const err = await res.json();
        window.showToast?.(err.error || 'Failed to update request', 'error');
      }
    } catch (e) {
      console.error(e);
      window.showToast?.('Error updating request status', 'error');
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
  }

  window.addEventListener('shell-ready', loadRequests);
</script>
<script src="../js/shell.js"></script>
</body>
</html>
