<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyAsset — Job Sites &amp; Location Management</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app-shell.css">
<style>
  .location-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px;
  }

  .stat-badge {
    padding: 6px 12px; border-radius: var(--radius-md); background: var(--status-neutral-bg); font-size: 12px; font-weight: 600; display: flex; justify-content: space-between;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(18, 24, 20, 0.55);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    background: var(--panel-bg);
    border-radius: var(--radius-lg);
    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: 10px 16px 36px var(--shadow-dark);
    width: 100%;
    max-width: 540px;
    padding: 24px;
  }
  .modal-field {
    margin-bottom: 12px;
  }
  .modal-field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar" aria-label="Sidebar"></aside>

  <div class="app-main">
    <header class="app-topbar">
      <button type="button" class="app-icon-btn app-menu-btn" id="appMenuBtn" aria-label="Open navigation"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>

      <div class="app-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="siteSearchInput" placeholder="Search job sites &amp; zones..." onkeyup="filterZones()">
      </div>

      <div class="app-topbar-actions">
        <a href="alerts.html" class="app-icon-btn" aria-label="Alerts" title="Alerts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></a>
        <div class="app-user" id="appUser" hidden>
          <span class="app-avatar" aria-hidden="true"></span>
          <span class="app-user-name"></span>
        </div>
        <button class="pill-btn pill-btn-emerald app-cta" id="appAddSiteBtn" onclick="openAddSiteModal()" aria-label="Add Job Site">
          <span class="app-cta-icon" aria-hidden="true">+</span><span class="app-cta-label">Add Job Site</span>
        </button>
      </div>
    </header>

    <main class="page-content">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;">
        <div>
          <h1 style="font-size: 26px; font-weight: 800; color: var(--text-primary);">Job Sites &amp; Locations</h1>
          <p style="font-size: 13.5px; color: var(--text-secondary); margin-top: 2px;">Monitor active site zones, equipment distribution, and local gate alerts.</p>
        </div>
        <button class="pill-btn pill-btn-emerald" id="pageAddSiteBtn" onclick="openAddSiteModal()">+ Add Site / Zone</button>
      </div>

      <!-- LOCATION CARDS GRID -->
      <div class="location-grid" id="zonesContainer">
        <div style="grid-column: 1 / -1; text-align: center; color: var(--text-secondary);">Loading job sites...</div>
      </div>
    </main>
  </div>
</div>

<!-- ADD SITE MODAL -->
<div class="modal-overlay" id="addSiteModal">
  <div class="modal-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h3 style="font-size: 18px; font-weight: 800;">Register New Site / Zone</h3>
      <button type="button" onclick="closeAddSiteModal()" style="border:none; background:none; font-size:20px; cursor:pointer;" aria-label="Close modal">✕</button>
    </div>
    
    <div id="addSiteError" style="display: none; padding: 10px 14px; background: rgba(220, 38, 38, 0.1); border: 1px solid var(--rose-crimson); border-radius: 8px; color: var(--rose-crimson); font-size: 13px; font-weight: 600; margin-bottom: 14px;"></div>

    <form onsubmit="handleAddSiteSubmit(event)">
      <div class="modal-field">
        <label for="newZoneName">Zone / Site Name *</label>
        <div class="neu-inset" style="padding: 8px 14px;">
          <input type="text" id="newZoneName" required placeholder="e.g. Zone B - North Yard" style="border:none; background:transparent; width:100%; outline:none;">
        </div>
      </div>

      <div class="modal-field">
        <label for="locationSelect">Facility / Parent Location *</label>
        <div class="neu-inset" style="padding: 8px 14px;">
          <select id="locationSelect" onchange="handleLocationSelectChange()" style="border:none; background:transparent; width:100%; outline:none; font-size: 13.5px; color: var(--text-primary); cursor: pointer;">
            <option value="__NEW__">+ Create New Facility / Location...</option>
          </select>
        </div>
      </div>

      <div id="newLocationFields">
        <div class="modal-field">
          <label for="newLocationName">New Facility Name *</label>
          <div class="neu-inset" style="padding: 8px 14px;">
            <input type="text" id="newLocationName" placeholder="e.g. Seattle Central Depot" style="border:none; background:transparent; width:100%; outline:none;">
          </div>
        </div>
        <div class="modal-field">
          <label for="newAddress">Address / Geo Coordinates (Optional)</label>
          <div class="neu-inset" style="padding: 8px 14px;">
            <input type="text" id="newAddress" placeholder="e.g. 1042 Industrial Parkway" style="border:none; background:transparent; width:100%; outline:none;">
          </div>
        </div>
      </div>

      <div class="modal-field">
        <label for="newDescription">Description / Operational Purpose (Optional)</label>
        <div class="neu-inset" style="padding: 8px 14px;">
          <input type="text" id="newDescription" placeholder="e.g. Equipment staging, repairs, or primary laydown yard" style="border:none; background:transparent; width:100%; outline:none;">
        </div>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button type="submit" id="submitSiteBtn" class="pill-btn pill-btn-emerald" style="flex: 1; justify-content: center;">Save Site</button>
        <button type="button" class="pill-btn pill-btn-light" onclick="closeAddSiteModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<!-- SITE DETAILS MODAL -->
<div class="modal-overlay" id="siteDetailsModal">
  <div class="modal-card" style="max-width: 640px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h3 style="font-size: 18px; font-weight: 800;" id="modalSiteTitle">Site Details</h3>
      <button type="button" onclick="closeSiteDetailsModal()" style="border:none; background:none; font-size:20px; cursor:pointer;" aria-label="Close modal">✕</button>
    </div>
    
    <div id="modalSiteContent">
      <div style="text-align: center; padding: 20px;">Loading details...</div>
    </div>
  </div>
</div>

<script>
  let allZones = [];
  let availableLocations = [];

  async function loadLocationsForSelect() {
    const select = document.getElementById('locationSelect');
    if (!select) return;

    try {
      const res = await fetch('/api/v1/locations');
      if (res.ok) {
        const data = await res.json();
        availableLocations = Array.isArray(data) ? data : [];
      } else {
        availableLocations = [];
      }
    } catch (e) {
      console.warn('Could not load locations:', e);
      availableLocations = [];
    }

    select.innerHTML = '';
    if (availableLocations.length > 0) {
      availableLocations.forEach(loc => {
        const opt = document.createElement('option');
        opt.value = loc.id;
        opt.textContent = loc.name + (loc.address ? ` (${loc.address})` : '');
        select.appendChild(opt);
      });
      const newOpt = document.createElement('option');
      newOpt.value = '__NEW__';
      newOpt.textContent = '+ Create New Facility / Location...';
      select.appendChild(newOpt);
    } else {
      const newOpt = document.createElement('option');
      newOpt.value = '__NEW__';
      newOpt.textContent = '+ Create New Facility / Location...';
      select.appendChild(newOpt);
    }

    handleLocationSelectChange();
  }

  function handleLocationSelectChange() {
    const select = document.getElementById('locationSelect');
    const fields = document.getElementById('newLocationFields');
    const locNameInput = document.getElementById('newLocationName');
    if (!select || !fields) return;

    if (select.value === '__NEW__') {
      fields.style.display = 'block';
      if (locNameInput) locNameInput.required = true;
    } else {
      fields.style.display = 'none';
      if (locNameInput) locNameInput.required = false;
    }
  }

  async function loadZones() {
    const container = document.getElementById('zonesContainer');
    try {
      const res = await fetch('/api/v1/zones');
      if (res.status === 401) {
        window.location.href = '/pages/login.html';
        return;
      }

      const data = await res.json().catch(() => null);
      if (!res.ok) {
        const errorMsg = (data && data.error) ? data.error : `Failed to load job sites (HTTP ${res.status})`;
        allZones = [];
        renderZoneError(errorMsg);
        return;
      }

      if (!Array.isArray(data)) {
        allZones = [];
        const errorMsg = (data && data.error) ? data.error : 'Unexpected response format from server';
        renderZoneError(errorMsg);
        return;
      }

      allZones = data;
      renderZones(allZones);
    } catch(e) {
      console.error('Error loading zones:', e);
      allZones = [];
      renderZoneError('Network error loading job sites. Please check your connection.');
    }
  }

  function renderZoneError(message) {
    const container = document.getElementById('zonesContainer');
    if (!container) return;
    container.innerHTML = `
      <div style="grid-column: 1 / -1; text-align: center; padding: 40px 20px;">
        <div style="color: var(--rose-crimson); font-weight: 700; margin-bottom: 8px;">⚠️ ${escapeHtml(message)}</div>
        <button class="pill-btn pill-btn-light" onclick="loadZones()" style="margin-top: 10px;">Retry</button>
      </div>
    `;
  }

  function renderZones(zones) {
    const container = document.getElementById('zonesContainer');
    if (!container) return;

    if (!Array.isArray(zones)) {
      renderZoneError((zones && zones.error) || 'Invalid data received');
      return;
    }

    if (zones.length === 0) {
      const userRole = window.currentUser ? (window.currentUser.role_name || window.currentUser.role || '').toUpperCase() : '';
      let emptyMsg = 'No job sites registered yet. Click "+ Add Site" to create one.';
      if (userRole === 'SITE / CREW SUPERVISOR' || userRole === 'FIELD WORKER') {
        emptyMsg = 'No job sites or zones have been assigned to your crew profile yet. Please contact an Operations Manager or Administrator.';
      } else if (userRole === 'MAINTENANCE STAFF') {
        emptyMsg = 'No job sites currently associated with scheduled maintenance.';
      }
      container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-tertiary); padding: 30px;">${escapeHtml(emptyMsg)}</div>`;
      return;
    }

    container.innerHTML = zones.map(zone => {
      const zoneName = zone.name || 'Unnamed Site';
      const locName = zone.location_name || 'Primary Facility';
      const coords = zone.location_address || zone.coordinates || 'Configured';
      return `
        <div class="neu-panel site-card" data-name="${escapeHtml(zoneName.toLowerCase())}" style="display: flex; flex-direction: column; justify-content: space-between;">
          <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
              <div>
                <h3 style="font-size: 18px; font-family: 'Outfit', sans-serif;">${escapeHtml(zoneName)}</h3>
                <div style="font-size: 11.5px; color: var(--text-tertiary);">${escapeHtml(locName)}</div>
              </div>
              <span class="pill-badge pill-ok">Active</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;">
              <div class="stat-badge"><span>📦 Asset Units</span><span><strong>${zone.asset_count || 0} Assets</strong></span></div>
              <div class="stat-badge"><span>👥 Assigned Crew</span><span><strong>${zone.employee_count || 0} Members</strong></span></div>
              <div class="stat-badge"><span>📍 Facility / Address</span><span style="font-size:11px; color:var(--text-secondary); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${escapeHtml(coords)}">${escapeHtml(coords)}</span></div>
            </div>
          </div>
          <button class="pill-btn pill-btn-light" style="width: 100%; justify-content: center;" onclick="viewZoneDetails(${zone.id}, '${escapeHtml(zoneName)}')">View Site Inventory →</button>
        </div>
      `;
    }).join('');
  }

  function filterZones() {
    if (!Array.isArray(allZones)) return;
    const q = (document.getElementById('siteSearchInput')?.value || '').toLowerCase();
    const filtered = allZones.filter(z => (z.name || '').toLowerCase().includes(q) || (z.location_name || '').toLowerCase().includes(q));
    renderZones(filtered);
  }

  async function openAddSiteModal() {
    const errorBanner = document.getElementById('addSiteError');
    if (errorBanner) errorBanner.style.display = 'none';

    document.getElementById('newZoneName').value = '';
    const locNameEl = document.getElementById('newLocationName');
    if (locNameEl) locNameEl.value = '';
    const addrEl = document.getElementById('newAddress');
    if (addrEl) addrEl.value = '';
    const descEl = document.getElementById('newDescription');
    if (descEl) descEl.value = '';

    await loadLocationsForSelect();
    document.getElementById('addSiteModal').classList.add('open');
  }

  function closeAddSiteModal() {
    const errorBanner = document.getElementById('addSiteError');
    if (errorBanner) errorBanner.style.display = 'none';
    document.getElementById('addSiteModal').classList.remove('open');
  }

  function showAddSiteError(msg) {
    const errorBanner = document.getElementById('addSiteError');
    if (errorBanner) {
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
    }
  }

  async function handleAddSiteSubmit(e) {
    e.preventDefault();
    const errorBanner = document.getElementById('addSiteError');
    if (errorBanner) errorBanner.style.display = 'none';

    const name = document.getElementById('newZoneName').value.trim();
    const select = document.getElementById('locationSelect');
    const isNewLocation = !select || select.value === '__NEW__';
    const locationName = document.getElementById('newLocationName')?.value.trim();
    const address = document.getElementById('newAddress')?.value.trim();
    const description = document.getElementById('newDescription')?.value.trim();

    if (!name) {
      showAddSiteError('Zone / Site name is required');
      return;
    }

    const payload = { name, description };
    if (isNewLocation) {
      if (!locationName) {
        showAddSiteError('Please enter a facility name for the new location');
        return;
      }
      payload.location_name = locationName;
      if (address) payload.address = address;
    } else {
      payload.location_id = Number(select.value);
    }

    const submitBtn = document.getElementById('submitSiteBtn');
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';
    }

    try {
      const zoneRes = await fetch('/api/v1/zones', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const zoneData = await zoneRes.json().catch(() => ({}));
      if (zoneRes.ok) {
        window.showToast?.('Site & Zone created successfully', 'success');
        closeAddSiteModal();
        await Promise.all([loadZones(), loadLocationsForSelect()]);
      } else {
        const errorMsg = zoneData.error || ('Failed to create site (HTTP ' + zoneRes.status + ')');
        showAddSiteError(errorMsg);
        window.showToast?.(errorMsg, 'error');
      }
    } catch (err) {
      console.error('Error registering site:', err);
      const msg = 'Network error registering site. Please check your connection.';
      showAddSiteError(msg);
      window.showToast?.(msg, 'error');
    } finally {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save Site';
      }
    }
  }

  async function viewZoneDetails(zoneId, zoneName) {
    document.getElementById('modalSiteTitle').textContent = `Site Inventory: ${zoneName}`;
    const modalContent = document.getElementById('modalSiteContent');
    modalContent.innerHTML = '<div style="text-align: center; padding: 20px;">Loading site details...</div>';
    document.getElementById('siteDetailsModal').classList.add('open');

    try {
      const res = await fetch(`/api/v1/zones/${zoneId}`);
      if (res.ok) {
        const data = await res.json();
        const assets = data.assets || [];
        const crew = data.crew || [];

        modalContent.innerHTML = `
          <div style="margin-bottom: 16px;">
            <h4 style="font-size: 14px; font-weight: 700; margin-bottom: 8px;">Stationed Assets (${assets.length})</h4>
            <div style="max-height: 180px; overflow-y: auto; background: rgba(234,230,220,0.3); border-radius: 8px; padding: 8px;">
              ${assets.length === 0 ? '<div style="color:var(--text-tertiary); font-size:12.5px;">No assets stationed here.</div>' : 
                assets.map(a => `
                  <div style="display:flex; justify-content:space-between; padding: 6px 8px; border-bottom: 1px solid var(--status-neutral-bg); font-size:12.5px;">
                    <span><strong>${escapeHtml(a.name)}</strong> (${escapeHtml(a.tag_id)})</span>
                    <span class="pill-badge ${a.status === 'AVAILABLE' ? 'pill-ok' : 'pill-neutral'}">${a.status}</span>
                  </div>
                `).join('')
              }
            </div>
          </div>

          <div>
            <h4 style="font-size: 14px; font-weight: 700; margin-bottom: 8px;">Assigned Personnel (${crew.length})</h4>
            <div style="max-height: 140px; overflow-y: auto; background: rgba(234,230,220,0.3); border-radius: 8px; padding: 8px;">
              ${crew.length === 0 ? '<div style="color:var(--text-tertiary); font-size:12.5px;">No crew assigned to this site.</div>' : 
                crew.map(c => `
                  <div style="display:flex; justify-content:space-between; padding: 6px 8px; border-bottom: 1px solid var(--status-neutral-bg); font-size:12.5px;">
                    <span><strong>${escapeHtml(c.first_name)} ${escapeHtml(c.last_name)}</strong></span>
                    <span style="color:var(--text-secondary);">${escapeHtml(c.role_name || c.job_title || 'Staff')}</span>
                  </div>
                `).join('')
              }
            </div>
          </div>
        `;
      } else {
        modalContent.innerHTML = '<div style="color:var(--rose-crimson); padding: 20px;">Failed to load site details.</div>';
      }
    } catch (e) {
      console.error(e);
      modalContent.innerHTML = '<div style="color:var(--rose-crimson); padding: 20px;">Network error loading site details.</div>';
    }
  }

  function closeSiteDetailsModal() {
    document.getElementById('siteDetailsModal').classList.remove('open');
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
  }

  function checkRolePermissions() {
    const canManage = window.currentUser && (window.currentUser.role_name === 'ADMIN' || window.currentUser.role_name === 'OPERATIONS MANAGER');
    const appBtn = document.getElementById('appAddSiteBtn');
    const pageBtn = document.getElementById('pageAddSiteBtn');
    if (appBtn) appBtn.style.display = canManage ? '' : 'none';
    if (pageBtn) pageBtn.style.display = canManage ? '' : 'none';
  }

  window.addEventListener('shell-ready', () => {
    checkRolePermissions();
    loadZones();
    loadLocationsForSelect();
  });
</script>
<script src="../js/shell.js"></script>
</body>
</html>
