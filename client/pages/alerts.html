<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyAsset — Alert Center &amp; Security</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app-shell.css">
<style>
  .tabs-nav {
    display: flex; gap: 8px; padding: 4px; background: #EAE6DC; border-radius: var(--radius-pill); box-shadow: inset 2px 3px 6px var(--inset-dark); margin-bottom: 20px; width: fit-content;
  }

  .tab-btn {
    padding: 8px 20px; border-radius: var(--radius-pill); font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600; color: var(--text-secondary); background: transparent; border: none; cursor: pointer; transition: all 0.2s ease;
  }

  .tab-btn.active, .tab-btn:hover { background: #FFFFFF; color: var(--text-primary); box-shadow: 2px 3px 8px rgba(175, 168, 150, 0.4); }

  .alert-card {
    background: var(--panel-bg); border-radius: var(--radius-lg); border: 1px solid rgba(255,255,255,0.85); box-shadow: 8px 10px 20px var(--shadow-dark); padding: 18px 22px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 16px;
  }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar" aria-label="Sidebar"></aside>

  <div class="app-main">
    <header class="app-topbar">
      <button type="button" class="app-icon-btn app-menu-btn" id="appMenuBtn" aria-label="Open navigation"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>

      <div class="app-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="alertSearchInput" placeholder="Search system alerts..." onkeyup="filterAlerts()">
      </div>

      <div class="app-topbar-actions">
        <a href="alerts.html" class="app-icon-btn" aria-label="Alerts" title="Alerts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></a>
        <div class="app-user" id="appUser" hidden>
          <span class="app-avatar" aria-hidden="true"></span>
          <span class="app-user-name"></span>
        </div>
      </div>
    </header>

    <main class="page-content">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;">
        <div>
          <h1 style="font-size: 26px; font-weight: 800; color: var(--text-primary);">Alert Center</h1>
          <p style="font-size: 13.5px; color: var(--text-secondary); margin-top: 2px;">Real-time operational alerts, service notifications, and condition triggers.</p>
        </div>
      </div>

      <!-- TABS NAV -->
      <div class="tabs-nav">
        <button class="tab-btn active" id="tabAll" onclick="setTab('all', this)">All Alerts (<span id="allCount">0</span>)</button>
        <button class="tab-btn" id="tabUnresolved" onclick="setTab('unresolved', this)">Unresolved (<span id="unresolvedCount">0</span>)</button>
        <button class="tab-btn" id="tabResolved" onclick="setTab('resolved', this)">Resolved (<span id="resolvedCount">0</span>)</button>
      </div>

      <!-- ALERTS LIST -->
      <div id="alertsContainer">
        <div style="text-align: center; padding: 30px; color: var(--text-secondary);">Loading alerts from database...</div>
      </div>
    </main>
  </div>
</div>

<script>
  let allAlerts = [];
  let currentTab = 'all';

  async function loadAlerts() {
    try {
      const [alertsRes, statsRes] = await Promise.all([
        fetch('/api/v1/alerts'),
        fetch('/api/v1/alerts/stats')
      ]);

      if (statsRes.ok) {
        const stats = await statsRes.json();
        document.getElementById('allCount').textContent = stats.total || 0;
        document.getElementById('unresolvedCount').textContent = stats.unresolved || 0;
        document.getElementById('resolvedCount').textContent = stats.resolved || 0;
      }

      if (alertsRes.ok) {
        allAlerts = await alertsRes.json();
        renderAlerts();
      } else {
        document.getElementById('alertsContainer').innerHTML = '<div style="text-align: center; color: var(--rose-crimson); padding: 20px;">Failed to load alerts</div>';
      }
    } catch (e) {
      console.error(e);
      document.getElementById('alertsContainer').innerHTML = '<div style="text-align: center; color: var(--rose-crimson); padding: 20px;">Error connecting to database</div>';
    }
  }

  function setTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderAlerts();
  }

  function filterAlerts() {
    renderAlerts();
  }

  function renderAlerts() {
    const q = (document.getElementById('alertSearchInput')?.value || '').toLowerCase();
    const container = document.getElementById('alertsContainer');

    const filtered = allAlerts.filter(a => {
      const isResolved = a.status === 'RESOLVED';
      const matchesTab = (currentTab === 'all') || 
        (currentTab === 'unresolved' && !isResolved) || 
        (currentTab === 'resolved' && isResolved);

      const text = `${a.message || ''} ${a.severity || ''} ${a.asset_name || ''} ${a.tag_id || ''}`.toLowerCase();
      const matchesSearch = !q || text.includes(q);

      return matchesTab && matchesSearch;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<div class="neu-panel" style="text-align: center; padding: 40px; color: var(--text-tertiary);">No alerts found for this filter. All operational systems normal.</div>';
      return;
    }

    container.innerHTML = filtered.map(a => {
      const isResolved = a.status === 'RESOLVED';
      const severity = (a.severity || 'INFO').toUpperCase();
      const isHigh = severity === 'HIGH' || severity === 'CRITICAL';
      const isMed = severity === 'MEDIUM' || severity === 'WARNING';
      
      const borderColor = isResolved ? 'var(--status-ok-text)' : (isHigh ? 'var(--status-alert-text)' : (isMed ? 'var(--status-attn-text)' : 'var(--text-tertiary)'));
      const badgeClass = isResolved ? 'pill-ok' : (isHigh ? 'pill-alert' : (isMed ? 'pill-attn' : 'pill-neutral'));

      return `
        <div class="alert-card" style="border-left: 5px solid ${borderColor};">
          <div>
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 4px; flex-wrap: wrap;">
              <span class="pill-badge ${badgeClass}">${severity}</span>
              <strong style="font-size: 15px; color: ${isResolved ? 'var(--text-primary)' : borderColor};">${escapeHtml(a.message)}</strong>
              <span class="mono" style="font-size: 11.5px; color: var(--text-tertiary);">${new Date(a.created_at).toLocaleString()}</span>
            </div>
            ${a.asset_name ? `
              <div style="font-size: 13px; color: var(--text-primary); font-weight: 600; margin-top: 4px;">
                Asset: ${escapeHtml(a.asset_name)} <span class="mono" style="color:var(--emerald-deep); font-size:12px;">(${escapeHtml(a.tag_id || '')})</span>
              </div>
            ` : ''}
            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 2px;">Status: <strong>${a.status}</strong></div>
          </div>
          <div style="display: flex; gap: 8px;">
            ${!isResolved ? `
              <button class="pill-btn pill-btn-emerald" style="padding: 6px 14px; font-size: 12px;" onclick="resolveAlert(${a.id})">Mark Resolved</button>
            ` : `<span class="pill-badge pill-ok">Resolved</span>`}
            ${a.related_entity_id ? `
              <button class="pill-btn pill-btn-light" style="padding: 6px 14px; font-size: 12px;" onclick="window.location.href='asset-details.html?id=${a.related_entity_id}'">View Asset</button>
            ` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  async function resolveAlert(id) {
    try {
      const res = await fetch(`/api/v1/alerts/${id}/resolve`, {
        method: 'PATCH'
      });

      if (res.ok) {
        window.showToast?.('Alert marked as resolved', 'success');
        await loadAlerts();
      } else {
        const err = await res.json();
        window.showToast?.(err.error || 'Failed to resolve alert', 'error');
      }
    } catch (e) {
      console.error(e);
      window.showToast?.('Error resolving alert', 'error');
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
  }

  window.addEventListener('shell-ready', loadAlerts);
</script>
<script src="../js/shell.js"></script>
</body>
</html>
