<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyAsset — System Settings &amp; Configuration</title>
<link rel="stylesheet" href="tokens.css">
<style>
  .top-navbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; background: rgba(248, 246, 240, 0.9); backdrop-filter: blur(14px);
    border-radius: var(--radius-pill); border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: 8px 10px 20px var(--shadow-dark), -6px -6px 16px var(--shadow-light);
    margin-bottom: 24px; gap: 16px; flex-wrap: wrap;
  }

  .brand-logo { display: flex; align-items: center; gap: 10px; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 18px; color: var(--text-primary); }
  .brand-icon { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary)); display: flex; align-items: center; justify-content: center; color: #FFFFFF; }

  .app-layout { display: grid; grid-template-columns: 240px 1fr; gap: 24px; }
  .neu-sidebar { background: var(--panel-bg); border-radius: var(--radius-lg); border: 1px solid rgba(255, 255, 255, 0.85); box-shadow: 10px 12px 24px var(--shadow-dark), -8px -8px 20px var(--shadow-light); padding: 20px 14px; display: flex; flex-direction: column; gap: 20px; }

  .sidebar-group-title { font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-tertiary); padding: 0 10px 6px; }
  .sidebar-link { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: var(--radius-pill); color: var(--text-secondary); font-weight: 600; font-size: 13px; transition: all 0.2s ease; }
  .sidebar-link-content { display: flex; align-items: center; gap: 10px; }
  .sidebar-link svg { width: 17px; height: 17px; stroke: var(--text-secondary); }
  .sidebar-link.active { background: var(--brand-primary); color: #FFFFFF; }
  .sidebar-link.active svg { stroke: #FFFFFF; }

  .settings-layout { display: grid; grid-template-columns: 200px 1fr; gap: 20px; }
  .settings-nav-btn { width: 100%; text-align: left; padding: 10px 14px; border-radius: var(--radius-pill); border: none; background: transparent; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: var(--text-secondary); cursor: pointer; }
  .settings-nav-btn.active, .settings-nav-btn:hover { background: #FFFFFF; color: var(--text-primary); box-shadow: 2px 3px 8px var(--shadow-dark); }
</style>
</head>
<body>

<div class="podium-stage">
  <!-- 3D Accent Spheres -->
  <div class="sphere-3d sphere-fuzzy" style="top: -12px; left: -12px;"></div>
  <div class="sphere-3d sphere-orange" style="bottom: 25px; right: 25px;"></div>

  <!-- TOP FLOATING NAVBAR -->
  <header class="top-navbar">
    <div class="brand-logo">
      <div class="brand-icon">⚡</div>
      <span>MyAsset Pro</span>
    </div>

    <div class="neu-inset" style="padding: 8px 18px; display: flex; align-items: center; gap: 8px; width: 340px;">
      <span>🔍</span>
      <input type="text" placeholder="Search settings..." style="border:none; background:transparent; outline:none; font-size:12.5px; width:100%;">
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--brand-primary); color: #FFF; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 12px;">AD</div>
        <span style="font-weight: 600; font-size: 13px;">Admin User</span>
      </div>
    </div>
  </header>

  <!-- APP LAYOUT SHELL -->
  <div class="app-layout">
    <!-- LEFT SIDEBAR -->
    <aside class="neu-sidebar">
      <div>
        <div class="sidebar-group-title">Main</div>
        <a href="overview.html" class="sidebar-link"><div class="sidebar-link-content"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span>Overview</span></div></a>
      </div>

      <div>
        <div class="sidebar-group-title">System</div>
        <a href="settings.html" class="sidebar-link active">
          <div class="sidebar-link-content"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"></circle></svg><span>Settings</span></div>
        </a>
        <a href="admin.html" class="sidebar-link"><div class="sidebar-link-content"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg><span>Admin</span></div></a>
      </div>
    </aside>

    <!-- RIGHT STAGE CONTENT -->
    <main>
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;">
        <div>
          <h1 style="font-size: 26px; font-weight: 800; color: var(--text-primary);">Settings</h1>
          <p style="font-size: 13.5px; color: var(--text-secondary); margin-top: 2px;">Manage system preferences, company details, hardware RFID gateways, and security.</p>
        </div>
      </div>

      <div class="settings-layout">
        <!-- Settings Nav -->
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <button class="settings-nav-btn active">General</button>
          <button class="settings-nav-btn">Company</button>
          <button class="settings-nav-btn">Notifications</button>
          <button class="settings-nav-btn">Users &amp; Roles</button>
          <button class="settings-nav-btn">Security</button>
          <button class="settings-nav-btn">Hardware &amp; RFID</button>
          <button class="settings-nav-btn">Integrations</button>
        </div>

        <!-- Settings Form Panel -->
        <div class="neu-panel">
          <h2 style="font-size: 18px; margin-bottom: 16px; font-family: 'Outfit', sans-serif;">General Organization Preferences</h2>
          
          <div style="display: flex; flex-direction: column; gap: 14px; max-width: 500px;">
            <div>
              <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary);">Organization Name</label>
              <div class="neu-inset" style="padding: 10px 16px; margin-top: 4px;">
                <input type="text" value="Greenfield Landscaping &amp; Asset Operations" style="border:none; background:transparent; outline:none; width:100%; font-family:'Inter',sans-serif;">
              </div>
            </div>

            <div>
              <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary);">Default RFID Gateway Mode</label>
              <select class="filter-select" style="width:100%; margin-top:4px;">
                <option value="auto">Automatic Real-Time Sync (142 ms)</option>
                <option value="batch">Batch Gate Scan</option>
              </select>
            </div>

            <button class="pill-btn pill-btn-emerald" style="width: fit-content; margin-top: 10px;" onclick="alert('Settings Saved Successfully!')">Save Preferences</button>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="shell.js"></script>
</body>
</html>
