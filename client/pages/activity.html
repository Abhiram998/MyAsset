<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyAsset — Activity &amp; Audit Log</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app-shell.css">
<style>
  .filter-select { padding: 8px 14px; border-radius: var(--radius-pill); border: 1px solid rgba(255,255,255,0.9); background: var(--panel-bg); font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 500; color: var(--text-primary); box-shadow: 2px 3px 8px var(--shadow-dark); outline: none; cursor: pointer; }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar" aria-label="Sidebar"></aside>

  <div class="app-main">
    <header class="app-topbar">
      <button type="button" class="app-icon-btn app-menu-btn" id="appMenuBtn" aria-label="Open navigation"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>

      <div class="app-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="activitySearchInput" placeholder="Search activity logs..." onkeyup="filterActivity()">
      </div>

      <div class="app-topbar-actions">
        <a href="alerts.html" class="app-icon-btn" aria-label="Alerts" title="Alerts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></a>
        <div class="app-user" id="appUser" hidden>
          <span class="app-avatar" aria-hidden="true"></span>
          <span class="app-user-name"></span>
        </div>
      </div>
    </header>

    <main class="page-content">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;">
        <div>
          <h1 style="font-size: 26px; font-weight: 800; color: var(--text-primary);">Activity &amp; Audit Log</h1>
          <p style="font-size: 13.5px; color: var(--text-secondary); margin-top: 2px;">Immutable timeline of all user actions, checkouts, and system events.</p>
        </div>

        <div style="display: flex; gap: 8px;">
          <select class="filter-select" id="actionFilterSelect" onchange="filterActivity()">
            <option value="all">All Actions</option>
          </select>
        </div>
      </div>

      <!-- AUDIT TIMELINE TABLE CARD -->
      <div class="neu-panel" style="padding: 0; overflow: hidden;">
        <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
          <thead>
            <tr style="background: rgba(234, 230, 220, 0.4); text-align: left; font-size: 11.5px; color: var(--text-secondary); text-transform: uppercase;">
              <th style="padding: 14px 18px;">Actor</th>
              <th style="padding: 14px 18px;">Action</th>
              <th style="padding: 14px 18px;">Asset Involved</th>
              <th style="padding: 14px 18px;">Site / Zone</th>
              <th style="padding: 14px 18px;">Details</th>
              <th style="padding: 14px 18px;">Timestamp</th>
            </tr>
          </thead>
          <tbody id="activityTableBody">
            <tr><td colspan="6" style="padding: 30px; text-align: center; color: var(--text-secondary);">Loading activity logs...</td></tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<script>
  let allActivities = [];

  async function loadActivity() {
    try {
      const res = await fetch('/api/v1/activity');
      if (res.ok) {
        const json = await res.json();
        allActivities = Array.isArray(json) ? json : (json.data || []);

        // Populate action filter
        const actions = [...new Set(allActivities.map(a => a.action))].filter(Boolean);
        const sel = document.getElementById('actionFilterSelect');
        sel.innerHTML = '<option value="all">All Actions</option>' + 
          actions.map(act => `<option value="${act}">${act}</option>`).join('');

        renderActivity(allActivities);
      } else {
        document.getElementById('activityTableBody').innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px; color: var(--rose-crimson);">Failed to load activity logs</td></tr>';
      }
    } catch (e) {
      console.error(e);
      document.getElementById('activityTableBody').innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px; color: var(--rose-crimson);">Error connecting to database.</td></tr>';
    }
  }

  function renderActivity(activities) {
    const tbody = document.getElementById('activityTableBody');
    if (!activities || activities.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 30px; color: var(--text-tertiary);">No activity events recorded yet.</td></tr>';
      return;
    }

    tbody.innerHTML = activities.map(a => {
      const actorName = a.employee_name || a.user_email || 'System';
      const initials = actorName.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase() || 'SYS';

      return `
        <tr style="border-bottom: 1px solid var(--status-neutral-bg);">
          <td style="padding: 14px 18px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <div style="width: 26px; height: 26px; border-radius: 50%; background: #E0E7FF; color: #3730A3; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;">${initials}</div>
              <strong>${escapeHtml(actorName)}</strong>
            </div>
          </td>
          <td style="padding: 14px 18px;"><span class="pill-badge pill-neutral">${escapeHtml(a.action)}</span></td>
          <td style="padding: 14px 18px;">
            ${a.asset_name ? `<a href="asset-details.html?id=${a.asset_id}" style="color:var(--text-primary); text-decoration:none; font-weight:600;">${escapeHtml(a.asset_name)}</a> <span class="mono" style="font-size:11px; color:var(--emerald-deep);">(${escapeHtml(a.tag_id || '')})</span>` : '<span style="color:var(--text-tertiary);">—</span>'}
          </td>
          <td style="padding: 14px 18px;">${escapeHtml(a.zone_name || '—')}</td>
          <td style="padding: 14px 18px; color: var(--text-secondary);">${escapeHtml(a.details || '—')}</td>
          <td style="padding: 14px 18px;" class="mono">${new Date(a.created_at).toLocaleString()}</td>
        </tr>
      `;
    }).join('');
  }

  function filterActivity() {
    const q = (document.getElementById('activitySearchInput')?.value || '').toLowerCase();
    const actionVal = document.getElementById('actionFilterSelect')?.value || 'all';

    const filtered = allActivities.filter(a => {
      const text = `${a.employee_name || ''} ${a.user_email || ''} ${a.action || ''} ${a.asset_name || ''} ${a.tag_id || ''} ${a.details || ''} ${a.zone_name || ''}`.toLowerCase();
      const matchesSearch = !q || text.includes(q);
      const matchesAction = (actionVal === 'all' || a.action === actionVal);
      return matchesSearch && matchesAction;
    });

    renderActivity(filtered);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
  }

  window.addEventListener('shell-ready', loadActivity);
</script>
<script src="../js/shell.js"></script>
</body>
</html>
